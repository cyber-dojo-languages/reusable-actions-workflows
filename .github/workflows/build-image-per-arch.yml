name: Build image per arch

# Called by every cyber-dojo-languages repo's main.yml.
# Each architecture is built on a machine of that architecture, so nothing is
# emulated, and create-index then names the pushed digests in one index
# tagged with the commit sha.
#
# A language whose katas only run on x86-64 passes arm64: false. The index it
# publishes holds the amd64 manifest alone, so an arm64 host is told there is
# no matching manifest rather than being given an image whose katas cannot
# link.
#
# The first job keeps the caller's scheduled workflows switched on. GitHub
# disables them after 60 days with no commit in the repo, and a scheduled run
# is not a commit, so something has to commit. It has no needs, so a repo
# whose build is failing still keeps its schedule: that is the repo nobody
# looks at for two months, and the one that most needs this to work.

on:
  workflow_call:
    inputs:
      image_builder_ref:
        description: "The cyber-dojo-tools/image_builder ref to take the build script from"
        required: false
        type: string
        default: main
      arm64:
        description: "Build an arm64 image. False where the language is x86-64 only."
        required: false
        type: boolean
        default: true

jobs:

  # Deliberately has no needs, so it does not wait for the build and does not
  # care whether the build passes. A commit the GITHUB_TOKEN makes triggers no
  # workflow, so this cannot set off another run of the caller.
  keep-schedule-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: cyber-dojo-languages/pinned-checkout@main

      # The action commits only once the last commit is older than this, and
      # its own default is 50. That suited a keep-alive on a daily schedule,
      # which would reach day 51 and commit. This job runs weekly, so the
      # runs land on days 7, 14 and so on: against a default of 50 the first
      # qualifying run is day 56, leaving four days before GitHub's cutoff at
      # 60. Thirty brings that forward to day 35.
      - uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 30

  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: cyber-dojo-languages/pinned-checkout@main

      # Referenced by owner/repo/path, not by ./path. Inside a reusable
      # workflow ./path resolves against the calling repo's checkout, which is
      # a language repo and does not hold this action.
      - id: script
        uses: cyber-dojo-languages/reusable-actions-workflows/fetch-image-builder-script@main
        with:
          ref: ${{ inputs.image_builder_ref }}

      - name: Build, version-check and push the amd64 image by digest
        id: build
        env:
          SCRIPT: ${{ steps.script.outputs.path }}
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USERNAME: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
          TYPE: ${{ github.event_name }}
        run: |
          "${SCRIPT}" "${GITHUB_WORKSPACE}" --stage=arch

  build-arm64:
    if: inputs.arm64
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: cyber-dojo-languages/pinned-checkout@main

      - id: script
        uses: cyber-dojo-languages/reusable-actions-workflows/fetch-image-builder-script@main
        with:
          ref: ${{ inputs.image_builder_ref }}

      - name: Build, version-check and push the arm64 image by digest
        id: build
        env:
          SCRIPT: ${{ steps.script.outputs.path }}
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USERNAME: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
          TYPE: ${{ github.event_name }}
        run: |
          "${SCRIPT}" "${GITHUB_WORKSPACE}" --stage=arch

  # Runs only if every architecture asked for built, version-checked and
  # pushed, so a failure on any one publishes no tag at all. The condition is
  # spelled out because build-arm64 is skipped for an x86-64 only language,
  # and a skipped dependency would otherwise skip this job too.
  create-index:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: >-
      always() &&
      needs.build-amd64.result == 'success' &&
      (inputs.arm64 == false || needs.build-arm64.result == 'success')
    permissions:
      packages: write
      contents: read
    steps:
      - uses: cyber-dojo-languages/pinned-checkout@main

      - id: script
        uses: cyber-dojo-languages/reusable-actions-workflows/fetch-image-builder-script@main
        with:
          ref: ${{ inputs.image_builder_ref }}

      - name: Create the multi-arch index and tag it with the commit sha
        env:
          SCRIPT: ${{ steps.script.outputs.path }}
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USERNAME: ${{ github.actor }}
          REPO_NAME: ${{ github.event.repository.name }}
          TYPE: ${{ github.event_name }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          DIGESTS=(--digest="${AMD64_DIGEST}")
          if [ -n "${ARM64_DIGEST}" ]; then
            DIGESTS+=(--digest="${ARM64_DIGEST}")
          fi
          "${SCRIPT}" "${GITHUB_WORKSPACE}" --stage=index "${DIGESTS[@]}"
