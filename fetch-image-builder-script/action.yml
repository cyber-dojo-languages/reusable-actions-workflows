name: Fetch image_builder script
description: Downloads one image_builder script at the given ref and outputs its path

inputs:
  ref:
    description: "The cyber-dojo-tools/image_builder ref to take the script from"
    required: false
    default: main
  script:
    description: "The script's file name in cyber-dojo-tools/image_builder"
    required: false
    default: image_build_test_push_notify.sh

outputs:
  path:
    description: "Path of the downloaded executable script"
    value: ${{ steps.fetch.outputs.path }}

runs:
  using: composite
  steps:
    # Downloaded under RUNNER_TEMP rather than into the workspace, because the
    # script copies and commits its repo when git reports it dirty, and a
    # downloaded file sitting in the checkout would make it dirty.
    - name: Download ${{ inputs.script }}
      id: fetch
      shell: bash
      run: |
        name="${{ inputs.script }}"
        path="${RUNNER_TEMP}/${name}"
        curl --fail --silent --show-error \
          --output "${path}" \
          "https://raw.githubusercontent.com/cyber-dojo-tools/image_builder/${{ inputs.ref }}/${name}"
        chmod +x "${path}"
        echo "path=${path}" >> "${GITHUB_OUTPUT}"
